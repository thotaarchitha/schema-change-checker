name: ci

on:
  push:
  pull_request:
  # Lets me re-run CI from the Actions tab without a dummy commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      # Fixtures are committed manifests, so this needs no database
      - run: pytest -q

  warehouse:
    runs-on: ubuntu-latest
    # Seeding ~117k order lines is the slow part; past this something is stuck
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    env:
      DBT_PG_PASSWORD: ci-only
      DBT_PG_HOST: localhost
    defaults:
      run:
        working-directory: warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r ../requirements.txt
      - run: dbt build --profiles-dir .
