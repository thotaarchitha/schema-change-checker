# Local warehouse for dbt. PG_PORT lets you dodge a Postgres you already run on 5432.
services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DBT_PG_PASSWORD:-dev}
      POSTGRES_DB: shop
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 2s
      retries: 15
