version: 2

models:
  - name: stg_customers
    description: One row per customer, with emails lowercased so joins on email actually match.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: email
        description: Lowercased email address.

  - name: stg_products
    description: Product catalog with price cast to numeric.
    columns:
      - name: product_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: unit_price
        description: List price in dollars.

  - name: stg_orders
    description: One row per order. Status spellings are collapsed to five values.
    columns:
      - name: order_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              values: [placed, shipped, completed, returned, cancelled]
      - name: discount
        description: Discount rate applied to the whole order (0.10 = 10% off).

  - name: stg_order_items
    description: Order lines. Zero-quantity lines are dropped.
    columns:
      - name: order_item_id
        description: Primary key.
        data_tests: [unique, not_null]

  - name: stg_payments
    description: Payments converted from cents to dollars. An order can have more than one.
    columns:
      - name: payment_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: amount
        description: Amount in dollars.
